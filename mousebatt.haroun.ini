# mousebatt.ini for Haroun - rename to mousebatt.ini and put next to mousebatt.exe.
# Then right-click the tray icon > Reload mousebatt.ini.
# Rule: a listed program counts as running from the first time its window gets
# the focus until it closes. Alt-tab changes nothing and writes nothing.

[general]
# Used while no listed game is running (desktop). Try 500 (or "eco") to save battery.
default = 1000
delay_ms = 1500
enforce = true
sound = beep
sound_auto = false

[presets]
eco = 500
normal = 1000
fast = 2000

[apps]
# CHECK the file name in Task Manager > Details while the game runs
# (Discovery.exe is my best guess for THE FINALS, not confirmed).
Discovery.exe = fast
# Games that handle high rates badly:
# SomeGame.exe = normal

[hotkeys]
Ctrl+Shift+P = set 2000
Ctrl+Shift+O = set 1000
Ctrl+Shift+I = toggle 1000 2000
Ctrl+Shift+A = auto
