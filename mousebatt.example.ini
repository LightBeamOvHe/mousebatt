# mousebatt.ini - polling-rate rules, hotkeys and sounds.
# Easiest: tray icon > Settings... edits all of this in a window (and rewrites the
# file, without comments). This commented version is for editing by hand.
#
# Save as UTF-8, next to mousebatt.exe, then use "Reload mousebatt.ini" in the
# tray menu. Lines starting with # or ; are comments. Rates: 125, 250, 500,
# 1000, 2000, 4000, 8000 (also written 2k or 2000hz). A rate above what the
# current link supports (cable = 1000) is lowered to the highest it supports.
#
# How the automatic switching works, in one paragraph: a program listed in
# [apps] counts as "running" from the first time its window gets the focus
# until it closes. While it runs, its rate is used, whatever window you are
# looking at (alt-tab, a video on another screen... change nothing and write
# nothing to the mouse). When no listed program runs, `default` is used. The
# mouse is only written to when a listed program starts or closes.

[general]
# Rate used while none of the programs in [apps] is running (your "desktop"
# rate). "keep" = leave the mouse alone then.
# Example: default = 1000   or   default = eco
default = keep

# After a listed program starts or closes, wait this long (in milliseconds)
# before writing to the mouse.
delay_ms = 1500

# true  = when the periodic check (every 4 minutes, and after a replug or
#         resume from sleep) finds a different rate than the one wanted,
#         write it again. A rate changed from another tool is put back.
# false = never write unless a rule or a hotkey asks for it.
enforce = true

# Sound once the mouse has CONFIRMED the new rate:
#   off   = silence
#   beep  = a soft bell note, higher for a higher rate
#   voice = the rate spoken as a number ("two thousand"). Put your own
#           recordings in a folder named "sounds" next to the exe (2000.wav,
#           1000.wav ...) to replace the built-in English clips.
sound = beep

# Also play the sound when a rule (not a hotkey) changes the rate.
sound_auto = false

# true = while a game runs, don't read the mouse at all: no 4-minute battery
# check, nothing on a replug or wake-up, and `enforce` is paused too. The
# battery % in the tray simply waits until the game ends. Rate changes (game
# starts / stops, hotkeys) still happen. false = keep reading as usual.
pause_in_game = false

# Rate for a program recognised as a GAME by where it is installed (Steam,
# Epic, GOG, Xbox, Riot, Ubisoft, EA folders) but not listed in [apps]. A
# listed program always wins, so the usual setup is: default = 500 (desktop),
# game_rate = 1000, and the games that want something else listed in [apps].
# Launchers (Steam, Epic, Battle.net, ...) are never counted as games.
# "off" = don't recognise games.
game_rate = off

# Where games live: folder fragments separated by | (they replace the built-in
# list: \steamapps\common\, \epic games\, \gog galaxy\games\, \gog games\,
# \xboxgames\, \riot games\, \ubisoft game launcher\games\, \ea games\).
# game_folders = \steamapps\common\ | d:\games\

[presets]
# Your own names for rates; usable in [apps] and [hotkeys].
eco = 500
normal = 1000
fast = 2000

[apps]
# Program file name (Task Manager > Details tab) = rate or preset.
# Discovery.exe = fast
# SomeOtherGame.exe = normal

[hotkeys]
# Modifier(s)+key = action. At least one of Ctrl, Shift, Alt, Win is required.
# Keys: letters, digits, F1-F24, Numpad0-Numpad9, Up, Down, Left, Right,
# Home, End, PageUp, PageDown, Insert, Delete, Space, Tab, Enter, Esc.
#
# Actions:
#   set <rate or preset>        e.g. set 2000   (plain "2000" works too)
#   up / down                   one step up / down the rates the link supports
#   toggle <rate> <rate>        switch between two rates
#   auto                        apply the rate the [apps] rules want right now
#
# A rate chosen by hotkey (or from the tray menu) holds until a listed
# program starts or closes; then the rules speak again.
Ctrl+Shift+P = set 2000
Ctrl+Shift+O = set 1000
# Ctrl+Shift+I = toggle 1000 2000
# Ctrl+Shift+A = auto
